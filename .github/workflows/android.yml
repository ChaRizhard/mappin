name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Bundle libraries
        run: npm run vendor
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --assetPath assets
        continue-on-error: true
      - name: Permissions
        run: node scripts/patch-native.mjs
      - name: Copy the app into the Android project
        run: npx cap sync android
      - name: Use the project's test signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mappin-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mappin-android
          path: Mappin-debug.apk
          retention-days: 30
